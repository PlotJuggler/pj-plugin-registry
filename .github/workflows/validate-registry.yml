name: Validate Registry

on:
  pull_request:
    paths:
      - 'registry.json'
  push:
    branches:
      - main
      - development
    paths:
      - 'registry.json'
  schedule:
    # Weekly check to detect if external URLs have become unavailable
    - cron: '0 6 * * 1'  # Monday 6am UTC
  workflow_dispatch:
    inputs:
      download_and_verify:
        description: 'Download all extensions and verify SHA256 checksums (slow)'
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate structure and URLs
        run: python3 scripts/validate_registry.py registry.json

      - name: Download extensions and verify checksums
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.download_and_verify)
        run: python3 scripts/validate_registry.py --download-extensions-and-verify-checksums registry.json
